version: "3.8"

services:
  # 1. Frontend: React + Vite + Tailwind
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  # 2. Backend: FastAPI + AI/OCR + Blockchain Abstraction
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - STORAGE_PROVIDER=minio
      - STORAGE_ENDPOINT=http://minio:9000
      - STORAGE_ACCESS_KEY=minioadmin
      - STORAGE_SECRET_KEY=minioadmin
      - STORAGE_BUCKET=nyayavault-documents
      - BLOCKCHAIN_NETWORK=hyperledger-fabric
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./backend/storage_data:/app/storage_data

  # 3. Relational Database: PostgreSQL
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: nyayavault
      POSTGRES_PASSWORD: nyayavault
      POSTGRES_DB: nyayavault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyayavault -d nyayavault"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Secure Object Storage: MinIO
  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 5. Vector Database: Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333"   # REST API & Web Dashboard
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

  # 6. Task Broker & Cache: Redis
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
  redis_data:

